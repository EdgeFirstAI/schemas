name: Test

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Version Sync Check (fast, runs first)
  # ============================================================================
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check version synchronization
        run: bash .github/scripts/check_version_sync.sh

  # ============================================================================
  # Rust Format Check (fast, runs in parallel)
  # ============================================================================
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  # ============================================================================
  # Rust and C Tests with Combined Coverage
  # ============================================================================
  # Both Rust unit tests and C API tests run in the same job to properly merge
  # coverage data. When tests run in separate jobs, profraw files are generated
  # separately and cannot be merged by cargo-llvm-cov.
  rust-and-c-test:
    name: Rust & C Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0  # Full history for SonarCloud blame
          lfs: true

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add llvm-tools-preview clippy

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@0bc4cd8a3e21db4cb9519857377b0c8c5e150de5 # v2.67.2
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@0bc4cd8a3e21db4cb9519857377b0c8c5e150de5 # v2.67.2
        with:
          tool: nextest

      - name: Install Criterion test framework
        run: |
          sudo apt-get update
          sudo apt-get install -y libcriterion-dev

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Generate Clippy report for SonarCloud
        run: |
          # Generate JSON report for SonarCloud Rust analysis
          cargo clippy --all-targets --all-features --message-format=json > clippy-report.json 2>&1 || true
          echo "Clippy report generated: $(wc -l < clippy-report.json) lines"

      - name: Run Rust unit tests with coverage
        run: |
          # Run Rust tests with coverage instrumentation using cargo-llvm-cov
          # The --no-report flag delays report generation so we can add C test coverage
          cargo llvm-cov nextest --all-features --workspace --profile ci --no-report
          echo "=== Rust unit tests completed ==="

      - name: Run Rust doc tests
        run: |
          # Run doc tests separately (nextest doesn't support doc tests)
          # Note: doc tests don't contribute to llvm-cov coverage
          cargo test --doc

      - name: Set up C test coverage environment
        run: |
          # Get the coverage environment from llvm-cov to run C tests with same profraw location
          # This ensures C test coverage is accumulated with Rust test coverage
          source <(cargo llvm-cov show-env --export-prefix)
          # Update profile path to write to llvm-cov-target directory
          export LLVM_PROFILE_FILE="${PWD}/target/llvm-cov-target/schemas-c-%p-%m.profraw"
          echo "LLVM_PROFILE_FILE=$LLVM_PROFILE_FILE" >> $GITHUB_ENV
          echo "C tests will write profraw to: $LLVM_PROFILE_FILE"

      - name: Run C API tests
        run: |
          # Build the C library, instrumented, into the coverage target dir.
          # `cargo llvm-cov nextest` above builds test binaries only: the capi
          # crate's cdylib/staticlib are not in that graph, because its Rust FFI
          # smoke tests are in-crate unit tests and nothing else depends on the
          # lib target. This used to fall out of the integration tests linking
          # capi's rlib, which no longer exists.
          #
          # Run in a subshell: show-env exports its own LLVM_PROFILE_FILE, and
          # the C tests below must keep the one set in the previous step.
          (
            source <(cargo llvm-cov show-env --export-prefix)
            CARGO_TARGET_DIR="${PWD}/target/llvm-cov-target" \
              cargo build -p edgefirst-schemas-capi --all-features
          )

          # Copy to where the gcc invocation below expects it. cargo writes the
          # shipped name directly (crates/capi sets `[lib] name =
          # "edgefirst_schemas"`), so this is a plain copy.
          COV_DEPS=target/llvm-cov-target/debug/deps
          if [ ! -f "${COV_DEPS}/libedgefirst_schemas.so" ]; then
            echo "::error::instrumented libedgefirst_schemas.so not found in ${COV_DEPS}"
            ls -l "${COV_DEPS}" | grep edgefirst_schemas || echo "(no edgefirst_schemas artifacts at all)"
            exit 1
          fi
          mkdir -p target/debug/deps
          cp -f "${COV_DEPS}"/libedgefirst_schemas.* target/debug/deps/
          cp -f "${COV_DEPS}"/libedgefirst_schemas.* target/debug/

          # Create the SONAME hop so the runtime loader resolves the library:
          # crates/capi/build.rs sets DT_SONAME to libedgefirst_schemas.so.<major>.
          MAJOR=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\([0-9]*\).*/\1/')
          ln -sf libedgefirst_schemas.so target/debug/deps/libedgefirst_schemas.so.${MAJOR}

          # Verify we have the instrumented library (check for profile symbols).
          # Fail hard if missing: otherwise C Criterion runs look green while
          # contributing zero attributed coverage to Sonar.
          echo "Verifying instrumented library:"
          PROFILE_SYMS=$(nm target/debug/deps/libedgefirst_schemas.so 2>/dev/null | grep -c "__llvm_profile" || true)
          echo "Profile symbols in cdylib: ${PROFILE_SYMS}"
          if [ "${PROFILE_SYMS}" -eq 0 ]; then
            echo "::error::libedgefirst_schemas.so is not coverage-instrumented"
            exit 1
          fi
          
          # Build C tests without rebuilding the library (lib target would overwrite instrumented library)
          # Build test binaries directly
          mkdir -p build build/test-results
          for src in crates/capi/tests/c/test_*.c; do
            name=$(basename $src .c)
            echo "Compiling $name..."
            gcc -Wall -Wextra -Werror -std=c11 -I./crates/capi/include -I/usr/include/criterion \
                -o build/$name $src \
                -L./target/debug/deps -ledgefirst_schemas -lcriterion -lm \
                -Wl,-rpath,./target/debug/deps
          done
          
          # Run C tests
          echo "Running C test suite..."
          C_PROFRAW_BEFORE=$(find target/llvm-cov-target -name 'schemas-c-*.profraw' | wc -l)
          for test in build/test_*; do
            name=$(basename $test)
            echo "Running $name..."
            ./$test --output=xml:build/test-results/$name.xml || exit 1
          done
          C_PROFRAW_AFTER=$(find target/llvm-cov-target -name 'schemas-c-*.profraw' | wc -l)
          echo "C test profraw files: before=${C_PROFRAW_BEFORE} after=${C_PROFRAW_AFTER}"
          if [ "${C_PROFRAW_AFTER}" -le "${C_PROFRAW_BEFORE}" ]; then
            echo "::error::C tests did not emit schemas-c-*.profraw under target/llvm-cov-target"
            exit 1
          fi
          
          echo "=== C API tests completed ==="
          echo "Profraw files in coverage directory:"
          find target/llvm-cov-target -name "*.profraw" | wc -l

      - name: Generate combined coverage report
        run: |
          # Rust unit/integration coverage (objects cargo-llvm-cov already tracks).
          cargo llvm-cov report --lcov --output-path lcov-rust.info

          # C Criterion loads a separately compiled instrumented cdylib. Those
          # counters do not attribute through `cargo llvm-cov report` even with
          # LLVM_COV_FLAGS=--object (coverage mapping hashes differ from the
          # rlib used by Rust tests). Export a second LCOV from the same .so
          # the C tests loaded, then union-merge hit counts.
          COV_SO="${PWD}/target/debug/deps/libedgefirst_schemas.so"
          if [ ! -f "${COV_SO}" ]; then
            echo "::error::missing instrumented cdylib for coverage merge: ${COV_SO}"
            exit 1
          fi
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          SYSROOT=$(rustc --print sysroot)
          LLVM_PROFDATA="${SYSROOT}/lib/rustlib/${HOST}/bin/llvm-profdata"
          LLVM_COV="${SYSROOT}/lib/rustlib/${HOST}/bin/llvm-cov"
          find target/llvm-cov-target -name 'schemas-c-*.profraw' > target/llvm-cov-target/c-profraw.list
          if [ ! -s target/llvm-cov-target/c-profraw.list ]; then
            echo "::error::no schemas-c-*.profraw files to merge"
            exit 1
          fi
          "${LLVM_PROFDATA}" merge -sparse -f target/llvm-cov-target/c-profraw.list \
            -o target/llvm-cov-target/c.profdata
          "${LLVM_COV}" export -format=lcov \
            -instr-profile=target/llvm-cov-target/c.profdata \
            "${COV_SO}" \
            --ignore-filename-regex='/\.cargo/' \
            > lcov-c.info

          python3 - <<'PY'
          """Union-merge LCOV reports: per file, keep max hit count per line."""
          import os
          from pathlib import Path
          from collections import defaultdict

          def parse(path: Path):
              files = {}
              cur = None
              das = {}
              for line in path.read_text().splitlines():
                  if line.startswith("SF:"):
                      cur = line[3:]
                      das = {}
                  elif line.startswith("DA:") and cur is not None:
                      ln, hits = line[3:].split(",")[:2]
                      das[int(ln)] = int(hits)
                  elif line == "end_of_record" and cur is not None:
                      files[cur] = das
                      cur = None
              return files

          workspace = Path(os.environ.get("GITHUB_WORKSPACE", os.getcwd())).resolve()

          def normalize(path: str):
              p = Path(path)
              try:
                  rel = str(p.resolve().relative_to(workspace))
              except Exception:
                  prefix = str(workspace) + "/"
                  s = str(p)
                  if s.startswith(prefix):
                      rel = s[len(prefix) :]
                  else:
                      return None
              # Drop toolchain / registry noise from llvm-cov export.
              if not (rel.startswith("crates/") or rel.startswith("src/")):
                  return None
              return rel

          merged = defaultdict(dict)
          for src in (Path("lcov-rust.info"), Path("lcov-c.info")):
              for sf, das in parse(src).items():
                  key = normalize(sf)
                  if key is None:
                      continue
                  slot = merged[key]
                  for ln, hits in das.items():
                      slot[ln] = max(slot.get(ln, 0), hits)

          out = []
          for sf in sorted(merged):
              das = merged[sf]
              out.append(f"SF:{sf}")
              for ln in sorted(das):
                  out.append(f"DA:{ln},{das[ln]}")
              total = len(das)
              covered = sum(1 for h in das.values() if h > 0)
              out.append(f"LF:{total}")
              out.append(f"LH:{covered}")
              out.append("end_of_record")
          Path("lcov.info").write_text("\n".join(out) + "\n")
          print(f"Merged LCOV: {len(merged)} source files")
          PY

          # Convert any remaining absolute paths (rust report usually already relative)
          sed -i "s|SF:$PWD/|SF:|g" lcov.info

          echo "=== Combined Coverage Summary ==="
          RUST_FILES=$(grep -c "^SF:" lcov.info || echo "0")
          echo "Source files with coverage data: $RUST_FILES"

          # Canary: Rust-only traffic leaves time_encode at 0 hits. A successful
          # cdylib LCOV merge attributes the #[no_mangle] wrapper (encode_fixed
          # may stay low due to monomorphization / coverage-map quirks).
          python3 - <<'PY'
          from pathlib import Path
          hits = {}
          in_file = False
          for line in Path("lcov.info").read_text().splitlines():
              if line.startswith("SF:") and line.rstrip().endswith("capi/src/lib.rs"):
                  in_file = True
                  hits = {}
              elif line.startswith("SF:"):
                  in_file = False
              elif in_file and line.startswith("DA:"):
                  ln, h = line[3:].split(",")[:2]
                  hits[int(ln)] = int(h)
              elif in_file and line == "end_of_record":
                  break
          src = Path("crates/capi/src/lib.rs").read_text().splitlines()
          helper_line = next(
              i for i, l in enumerate(src, 1) if "fn encode_fixed_to_buf" in l
          )
          encode_line = next(
              i
              for i, l in enumerate(src, 1)
              if "fn builtin_interfaces_time_encode" in l
          )
          helper_hits = hits.get(helper_line, 0)
          encode_hits = hits.get(encode_line, 0)
          c_lines = sum(
              1
              for line in Path("lcov-c.info").read_text().splitlines()
              if line.startswith("DA:") and int(line.split(",")[1]) > 0
          )
          print(
              f"coverage canary: encode_fixed_to_buf@{helper_line} hits={helper_hits}; "
              f"time_encode@{encode_line} hits={encode_hits}; "
              f"lcov-c covered DA lines={c_lines}"
          )
          if encode_hits < 1 or c_lines < 100:
              raise SystemExit(
                  "C coverage merge canary failed: expected time_encode hits >= 1 "
                  f"and lcov-c covered DA lines >= 100 (got encode={encode_hits}, "
                  f"helper={helper_hits}, c_lines={c_lines})"
              )
          PY

      - name: Generate coverage summary
        id: coverage
        run: |
          TOTAL_LINES=$(grep -E "^LF:" lcov.info 2>/dev/null | cut -d: -f2 | paste -sd+ | bc 2>/dev/null || echo "0")
          COVERED_LINES=$(grep -E "^LH:" lcov.info 2>/dev/null | cut -d: -f2 | paste -sd+ | bc 2>/dev/null || echo "0")
          if [ -z "$TOTAL_LINES" ]; then TOTAL_LINES=0; fi
          if [ -z "$COVERED_LINES" ]; then COVERED_LINES=0; fi
          if [ "$TOTAL_LINES" -gt 0 ]; then
            COVERAGE=$(echo "scale=2; $COVERED_LINES * 100 / $TOTAL_LINES" | bc)
          else
            COVERAGE="0"
          fi
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "Combined coverage: $COVERAGE% ($COVERED_LINES/$TOTAL_LINES lines)"

      - name: Upload combined coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rust-coverage
          path: lcov.info
          retention-days: 7

      - name: Upload Clippy report artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: clippy-report
          path: clippy-report.json
          retention-days: 7

      - name: Test Summary
        uses: EnricoMi/publish-unit-test-result-action@27d65e188ec43221b20d26de30f4892fad91df2f # v2.22.0
        with:
          files: |
            target/nextest/ci/junit.xml
            build/test-results/*.xml
          check_name: "Test Results (Rust + C API)"
          comment_mode: "off"
        if: always()

  # ============================================================================
  # Python Tests with Coverage
  # ============================================================================
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      # The pyo3 extension must be an instrumented Rust cdylib so pytest
      # writes LLVM profraw that cargo-llvm-cov can attribute back to
      # crates/{python,schemas}/src and Sonar can merge via
      # sonar.rust.lcov.reportPaths (show-env → maturin develop → pytest →
      # report). Do not `cargo llvm-cov clean` here: it drops the target-dir
      # bookkeeping report needs and makes it look under plain `target/`.
      - name: Install Rust toolchain (with llvm-tools)
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@0bc4cd8a3e21db4cb9519857377b0c8c5e150de5 # v2.67.2
        with:
          tool: cargo-llvm-cov

      - name: Install Python build/test dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install maturin pytest junitparser numpy pycdr2==1.0.0

      - name: Run pytest under cargo-llvm-cov
        run: |
          set -euo pipefail
          source .venv/bin/activate

          # Export RUSTFLAGS / LLVM_PROFILE_FILE so maturin builds an
          # instrumented cdylib. Explicitly pin CARGO_TARGET_DIR: some
          # cargo-llvm-cov versions do not export it via show-env, and
          # `set -u` would then abort on ${CARGO_TARGET_DIR}.
          source <(cargo llvm-cov show-env --export-prefix)
          COV_DIR="${PWD}/target/llvm-cov-target"
          mkdir -p "${COV_DIR}"
          export CARGO_TARGET_DIR="${COV_DIR}"
          export LLVM_PROFILE_FILE="${COV_DIR}/schemas-py-%p-%m.profraw"
          echo "CARGO_TARGET_DIR=${CARGO_TARGET_DIR}"
          echo "LLVM_PROFILE_FILE=${LLVM_PROFILE_FILE}"

          # maturin develop (not pip install -e) reuses cargo’s instrumented
          # RUSTFLAGS for the pyo3 cdylib.
          maturin develop --manifest-path crates/python/Cargo.toml

          EXT_SO=$(python - <<'PY'
          import edgefirst.schemas as m
          print(m.__file__)
          PY
          )
          echo "PyO3 extension module: ${EXT_SO}"
          if [ ! -f "${EXT_SO}" ]; then
            echo "::error::PyO3 extension module not found at ${EXT_SO}"
            exit 1
          fi
          PROFILE_SYMS=$(nm "${EXT_SO}" 2>/dev/null | grep -c "__llvm_profile" || true)
          echo "Profile symbols in PyO3 extension: ${PROFILE_SYMS}"
          if [ "${PROFILE_SYMS}" -eq 0 ]; then
            echo "::error::PyO3 extension is not coverage-instrumented (maturin did not pick up llvm-cov RUSTFLAGS)"
            exit 1
          fi

          PY_PROFRAW_BEFORE=$(find "${COV_DIR}" -name 'schemas-py-*.profraw' 2>/dev/null | wc -l)
          pytest tests/python/ --junitxml=pytest-results.xml -v
          PY_PROFRAW_AFTER=$(find "${COV_DIR}" -name 'schemas-py-*.profraw' 2>/dev/null | wc -l)
          echo "Python profraw files: before=${PY_PROFRAW_BEFORE} after=${PY_PROFRAW_AFTER}"
          if [ "${PY_PROFRAW_AFTER}" -le "${PY_PROFRAW_BEFORE}" ]; then
            echo "::error::pytest did not emit schemas-py-*.profraw under ${COV_DIR}"
            exit 1
          fi

          # Prefer cargo-llvm-cov report (historically ~85% on python/src/lib.rs).
          # Fall back to a direct llvm-cov export from the loaded extension if
          # report cannot find objects (external-test bookkeeping).
          if ! cargo llvm-cov report --lcov --output-path coverage-python.raw.lcov; then
            echo "cargo llvm-cov report failed; falling back to direct llvm-cov export"
            HOST=$(rustc -vV | sed -n 's/^host: //p')
            SYSROOT=$(rustc --print sysroot)
            LLVM_PROFDATA="${SYSROOT}/lib/rustlib/${HOST}/bin/llvm-profdata"
            LLVM_COV="${SYSROOT}/lib/rustlib/${HOST}/bin/llvm-cov"
            find "${COV_DIR}" -name 'schemas-py-*.profraw' > "${COV_DIR}/py-profraw.list"
            "${LLVM_PROFDATA}" merge -sparse -f "${COV_DIR}/py-profraw.list" \
              -o "${COV_DIR}/py.profdata"
            "${LLVM_COV}" export -format=lcov \
              -instr-profile="${COV_DIR}/py.profdata" \
              "${EXT_SO}" \
              --ignore-filename-regex='/\.cargo/|/rustc/|/rustlib/' \
              > coverage-python.raw.lcov
          fi

          # Keep only workspace crates/* sources and rewrite to relative SF:
          # paths. Direct llvm-cov export otherwise includes /rustc/... stdlib
          # entries that Sonar cannot map (and that trip absolute-path checks).
          python3 - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ.get("GITHUB_WORKSPACE", os.getcwd())).resolve()
          out = []
          keep = False
          buf = []

          def flush():
              global keep, buf
              if keep and buf:
                  out.extend(buf)
              keep = False
              buf = []

          def normalize(sf: str) -> str | None:
              p = Path(sf)
              try:
                  rel = p.resolve().relative_to(workspace)
              except Exception:
                  prefix = str(workspace) + "/"
                  if sf.startswith(prefix):
                      rel = Path(sf[len(prefix) :])
                  else:
                      return None
              rel_s = str(rel)
              if not rel_s.startswith("crates/"):
                  return None
              return rel_s

          for line in Path("coverage-python.raw.lcov").read_text().splitlines():
              if line.startswith("SF:"):
                  flush()
                  norm = normalize(line[3:])
                  if norm is None:
                      keep = False
                      buf = []
                  else:
                      keep = True
                      buf = [f"SF:{norm}"]
              elif line == "end_of_record":
                  if keep:
                      buf.append(line)
                      flush()
                  else:
                      buf = []
                      keep = False
              elif keep:
                  buf.append(line)
          flush()
          Path("coverage-python.lcov").write_text("\n".join(out) + ("\n" if out else ""))
          print(f"Filtered LCOV: {sum(1 for l in out if l.startswith('SF:'))} workspace files")
          PY

          echo "=== Python-driven Rust source coverage written to coverage-python.lcov ==="
          python3 - <<'PY'
          from pathlib import Path
          covered = total = 0
          in_file = False
          for line in Path("coverage-python.lcov").read_text().splitlines():
              if line.startswith("SF:"):
                  in_file = line.rstrip() == "SF:crates/python/src/lib.rs"
              elif in_file and line.startswith("DA:"):
                  _, hits = line[3:].split(",")[:2]
                  total += 1
                  if int(hits) > 0:
                      covered += 1
              elif in_file and line == "end_of_record":
                  break
          pct = 100.0 * covered / total if total else 0.0
          print(f"coverage canary: crates/python/src/lib.rs {covered}/{total} = {pct:.1f}%")
          if total < 1000 or pct < 50.0:
              raise SystemExit(
                  "Python→Rust coverage canary failed: expected "
                  f"crates/python/src/lib.rs coverage >= 50% with >=1000 "
                  f"instrumented lines (got {covered}/{total} = {pct:.1f}%)"
              )
          abs_workspace = [
              l
              for l in Path("coverage-python.lcov").read_text().splitlines()
              if l.startswith("SF:/")
          ]
          if abs_workspace:
              raise SystemExit(
                  "coverage-python.lcov still has absolute SF: paths; "
                  f"Sonar will not merge them (sample: {abs_workspace[0]})"
              )
          PY

      - name: Verify package import
        run: |
          source .venv/bin/activate
          python -c "import edgefirst.schemas; print('Package import OK')"

      - name: Verify CDR golden fixtures
        run: |
          source .venv/bin/activate
          python scripts/generate_cdr_testdata.py --verify

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-coverage
          path: coverage-python.lcov
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-test-results
          path: pytest-results.xml
          retention-days: 7
        if: always()

      - name: Test Summary
        uses: EnricoMi/publish-unit-test-result-action@27d65e188ec43221b20d26de30f4892fad91df2f # v2.22.0
        with:
          files: pytest-results.xml
          check_name: "Test Results (Python)"
          comment_mode: "off"
        if: always()

  # ============================================================================
  # C++ Tests (GCC + Clang matrix)
  # ============================================================================
  cpp-test:
    name: C++ Tests (${{ matrix.compiler }}, ${{ matrix.cxxstd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        cxxstd: [c++17, c++20]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            packages: ""
          - compiler: clang
            cc: clang
            cxx: clang++
            packages: "clang"
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install compiler
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Build Rust library
        run: cargo build --release

      - name: Run C++ tests with XML output
        env:
          CXX: ${{ matrix.cxx }}
        run: make test-cpp-xml CXXSTD=${{ matrix.cxxstd }}

      - name: Upload C++ test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cpp-test-results-${{ matrix.compiler }}-${{ matrix.cxxstd }}
          path: build/test-results/*.xml
          retention-days: 7
        if: always()

      - name: Test Summary
        uses: EnricoMi/publish-unit-test-result-action@27d65e188ec43221b20d26de30f4892fad91df2f # v2.22.0
        with:
          files: build/test-results/*.xml
          check_name: "Test Results (C++ ${{ matrix.compiler }}, ${{ matrix.cxxstd }})"
          comment_mode: "off"
        if: always()

  # ============================================================================
  # C++ Tests with AddressSanitizer + UBSan
  # ============================================================================
  cpp-test-asan:
    name: C++ Tests (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build Rust library
        run: cargo build --release

      - name: Run C++ tests under ASan/UBSan
        run: make test-cpp-asan

  # ============================================================================
  # Documentation build smoke test
  # ============================================================================
  docs-build:
    name: Docs Build (Doxygen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build Rust library
        run: make lib

      - name: Generate documentation
        run: make docs

      - name: Upload documentation artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: doxygen-html
          path: build/docs/html
          retention-days: 7

  # ============================================================================
  # C++23 smoke build (best-effort, non-blocking)
  # ============================================================================
  # Exercises the `std::expected` and `std::span` alias paths in
  # include/edgefirst/stdlib/*.hpp that only compile on C++23+. Since not all
  # compilers / stdlib versions ship std::expected yet, this job is
  # continue-on-error: true and informational-only.
  cpp-test-cxx23:
    name: C++ Tests (C++23 smoke)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true  # Golden CDR fixtures under testdata/ are LFS-tracked

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install GCC 13 (for C++23 std::expected support)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Build Rust library
        run: make lib

      - name: Build and run C++ tests on C++23
        run: make test-cpp CXX=$CXX CXXSTD=c++23

  # ============================================================================
  # macOS C/C++ smoke test (validates native build without coverage merge)
  # ============================================================================
  macos-smoke:
    name: macOS C/C++ Smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          lfs: true

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install Criterion (Homebrew)
        run: brew install criterion

      - name: Build library and run C/C++ tests
        run: |
          make lib
          make test-c
          make test-cpp

  # ============================================================================
  # SonarCloud Analysis (runs after all tests complete)
  # ============================================================================
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [rust-and-c-test, cpp-test, cpp-test-asan, python-test]
    # Only run on main repo (not forks) due to secrets
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0  # Full history for accurate blame

      - name: Download combined Rust/C coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rust-coverage
          path: .

      - name: Download Python coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: python-coverage
          path: .

      - name: Download Clippy report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: clippy-report
          path: .

      - name: Verify coverage files
        run: |
          echo "=== Coverage Files ==="
          ls -la lcov.info coverage-python.lcov clippy-report.json 2>/dev/null || echo "Some files missing"
          echo ""
          if [ ! -f lcov.info ] || [ ! -f coverage-python.lcov ]; then
            echo "::error::Missing required coverage artifact(s) for Sonar"
            exit 1
          fi
          echo "=== Combined LCOV Summary (Rust unit + C API) ==="
          RUST_FILES=$(grep -c "^SF:" lcov.info || echo "0")
          echo "Source files with coverage: $RUST_FILES"
          echo "=== Python-driven Rust LCOV Summary ==="
          PY_FILES=$(grep -c "^SF:" coverage-python.lcov || echo "0")
          echo "Source files with Python-driven coverage: $PY_FILES"
          # Absolute SF: paths do not map onto sonar.sources and silently
          # drop PyO3 / schemas hits from the merged Sonar coverage.
          if grep -q '^SF:/' lcov.info coverage-python.lcov; then
            echo "::error::Coverage LCOV still contains absolute SF: paths"
            grep '^SF:/' lcov.info coverage-python.lcov | head -20
            exit 1
          fi
          if ! grep -q 'SF:crates/python/src/lib.rs' coverage-python.lcov; then
            echo "::error::coverage-python.lcov missing crates/python/src/lib.rs"
            exit 1
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Both LCOV files describe the same Rust source files; Sonar
          # accepts a comma-separated list and merges them, so coverage
          # exercised by *either* the Rust unit tests or the Python tests
          # counts toward the line/branch totals. The Python module is now
          # written in Rust (pyo3); there's no separate Python-language
          # source to track via the old `sonar.python.coverage` setting.
          # Paths in both reports must be workspace-relative (SF:crates/...).
          args: >
            -Dsonar.rust.lcov.reportPaths=lcov.info,coverage-python.lcov
            -Dsonar.rust.clippy.reportPaths=clippy-report.json
