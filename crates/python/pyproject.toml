[project]
name = "edgefirst-schemas"
version = "4.0.0"
description = "Zero-copy CDR message types for EdgeFirst Perception (ROS 2 + Foxglove + custom)"
readme = "README.md"
# Install floor is Python 3.8. Two abi3 wheel families are published
# per OS/arch: cp38-abi3 (3.8+) and cp311-abi3 (3.11+, zero-copy
# Py_buffer). Pip on 3.11+ prefers the higher tag. Local `maturin
# develop` uses the 3.11 feature set below. The cp38-abi3 path pays
# the documented cost (input-side memcpy fallback, view() returns
# bytes not memoryview) because Py_buffer is not in the limited API
# before 3.11.
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Au-Zone Technologies", email = "support@au-zone.com" }]
keywords = ["ros2", "cdr", "foxglove", "zenoh", "perception", "edge-ai", "zero-copy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "numpy>=1.21"]

[project.urls]
Homepage = "https://doc.edgefirst.ai"
Repository = "https://github.com/EdgeFirstAI/schemas"
Issues = "https://github.com/EdgeFirstAI/schemas/issues"
Changelog = "https://github.com/EdgeFirstAI/schemas/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
# The compiled binary IS the user-facing module — no `_native` wrapper
# layer, no Python re-export files. Maturin places the abi3 .so at
# `edgefirst/schemas.abi3.so` (or `.pyd` on Windows). Submodules
# (`sensor_msgs`, etc.) are registered inside the binary via pyo3 and
# published into `sys.modules` so `from edgefirst.schemas.sensor_msgs
# import Image` resolves correctly.
module-name = "edgefirst.schemas"
python-source = "python"

# Bundle the PEP 561 marker plus per-submodule type stubs. Stub files
# live in `python/edgefirst/schemas/<submodule>.pyi`; type checkers
# (mypy, pyright) read them at type-check time without conflicting with
# the runtime binary at `edgefirst/schemas.abi3.so`.
include = [
    { path = "python/edgefirst/schemas/py.typed", format = ["wheel", "sdist"] },
]

# Default local/dev feature: cp311-abi3 (zero-copy Py_buffer). CI also
# builds `--no-default-features --features abi3-py38` so PyPI ships both
# families. Do not drop this default — `maturin develop` from the repo
# root should keep the 3.11+ path.
features = ["abi3-py311"]
