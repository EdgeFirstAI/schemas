[package]
name = "edgefirst-schemas-capi"
description = "C API for EdgeFirst Perception Schemas"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false  # C library — distributed via GitHub Releases, not crates.io

[lib]
# Cargo `[lib] name` must be unique across the workspace to avoid output
# filename collisions with the schemas crate (which produces libedgefirst_schemas.rlib).
# The public C library shipped to users is libedgefirst_schemas.{a,so} — the
# Makefile renames the cargo output for distribution. The SONAME baked into
# the cdylib is libedgefirst_schemas.so.MAJOR (see build.rs), independent of
# the file basename.
name = "edgefirst_schemas_capi"
# rlib is required so the Rust integration test under tests/ can link
# against the FFI exports. staticlib + cdylib are the C-distribution outputs.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
edgefirst-schemas = { path = "../schemas" }
errno = { workspace = true }
libc = { workspace = true }

[build-dependencies]
# cbindgen is declared for future header auto-generation but NOT invoked by
# build.rs today. include/edgefirst/schemas.h is maintained by hand (see
# .github/copilot-instructions.md).
cbindgen = { workspace = true }
