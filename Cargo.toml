[workspace]
resolver = "2"
members = ["crates/*"]
# crates/python is intentionally NOT in default-members: it is built via
# maturin, not `cargo build`. `cargo build` at the workspace root will only
# produce the rlib + the C library, which matches user expectations.
default-members = ["crates/schemas", "crates/capi"]

[workspace.package]
version = "3.5.0"
authors = ["Au-Zone Technologies <support@au-zone.com>"]
edition = "2021"
license = "Apache-2.0"
homepage = "https://doc.edgefirst.ai"
repository = "https://github.com/EdgeFirstAI/schemas"

[workspace.dependencies]
errno = "0.3"
libc = "0.2.180"
criterion = { version = "0.8.1", features = ["html_reports"] }
mcap = "0.25"
memmap2 = "0.9"
rand = "0.9.2"
cbindgen = "0.29.2"

# Release profile: optimized, stripped, no debug info
[profile.release]
opt-level = 3
lto = true
strip = true
debug = false

# Profiling profile: release build with debug symbols for benchmarking
[profile.profiling]
inherits = "release"
strip = false
debug = true
