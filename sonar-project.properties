sonar.projectKey=EdgeFirstAI_schemas
sonar.organization=edgefirstai

# Source directories
# crates/python/python holds the shipped .pyi stubs and py.typed marker —
# public API surface, not test code, so it belongs in sources.
sonar.sources=crates/schemas/src,crates/capi/src,crates/python/src,crates/python/python
sonar.tests=crates/schemas/tests,crates/capi/tests,tests/python

# Coverage report paths provided via -D arguments in CI workflow
# - Rust/C: LCOV (sonar.rust.lcov.reportPaths)
# - Python: Cobertura XML (sonar.python.coverage.reportPaths)

# Python configuration
sonar.python.version=3.11

# Disable C/C++ analysis - headers are API declarations only
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
